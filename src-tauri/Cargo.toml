[package]
name = "openwave"
version = "0.1.0"
description = "OpenWave — ad-free music player with Spotify search, YouTube playback and Audius"
authors = ["OpenWave"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "openwave_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
